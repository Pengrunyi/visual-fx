<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#100804" />
    <title>圣诞手势粒子 · Christmas Gestures</title>
    <meta name="description" content="金色粒子圣诞树随手势变化：握拳聚合成树，张开手掌炸成闪烁光点，OK 手势弹出橙色相框。照片与摄像头只在本地处理。" />
    <link rel="icon" href="%BASE_URL%favicon.svg" />
    <style>html,body{margin:0;background:#100804;height:100%;overflow:hidden}</style>
  </head>
  <body class="xmas">
    <canvas id="stage"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="fallback">
      <div class="fallback-tree" aria-hidden="true"></div>
      <p id="fallback-note">当前浏览器无法显示粒子，按钮和按键仍可切换。</p>
    </div>
    <div class="wordmark">
      <p class="merry">MERRY CHRISTMAS</p>
    </div>
    <aside class="cam-card" aria-label="摄像头">
      <div class="cam-stage">
        <video id="cam-video" playsinline webkit-playsinline x5-playsinline x5-video-player-type="h5" muted></video>
        <canvas id="cam-canvas"></canvas>
      </div>
      <p id="cam-label" class="cam-label" aria-live="polite">摄像头未开启</p>
      <button id="cam-button" type="button">开启摄像头</button>
    </aside>
    <div class="dock">
      <p class="legend">握拳聚成圣诞树 · 张开手掌化为光点 · OK 手势弹出照片</p>
      <div class="chips" role="group" aria-label="场景切换">
        <button type="button" data-mode="tree" aria-pressed="true">1 握拳 · 圣诞树</button>
        <button type="button" data-mode="burst" aria-pressed="false">2 张掌 · 光点</button>
        <button type="button" data-mode="photos" aria-pressed="false">3 OK · 照片</button>
      </div>
      <div class="upload-row">
        <button type="button" id="upload-button">上传人像或宠物</button>
        <button type="button" id="reset-photos" hidden>恢复示例</button>
        <input id="photo-input" type="file" accept="image/*" multiple hidden />
      </div>
      <p id="model-status" class="model-status">正在准备手势模型…</p>
      <p id="alert" class="alert" role="alert" hidden></p>
    </div>
    <div id="hud"></div>
    <script type="module" src="/src/scenes/christmas/main.ts"></script>
  </body>
</html>

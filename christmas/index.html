<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07091a" />
    <title>星座织树 · Constellation Tree</title>
    <meta name="description" content="夜空里的星座圣诞树：握拳收紧成树，张开手掌落下细雪，OK 手势把橙色相框挂上枝头。捏合可钉一颗星。照片与摄像头只在本地处理。" />
    <link rel="icon" href="%BASE_URL%favicon.svg" />
    <style>html,body{margin:0;background:#07091a;height:100%;overflow:hidden}</style>
  </head>
  <body class="xmas">
    <canvas id="stage"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="fallback">
      <svg viewBox="0 0 200 240" aria-hidden="true">
        <g fill="none" stroke="#d5deee" stroke-width="1.2">
          <path d="M100 18 L78 58 L58 98 L36 146 L22 186" />
          <path d="M100 18 L122 58 L142 98 L164 146 L178 186" />
          <path d="M100 18 L100 186" stroke="#e7d3a1" />
          <path d="M78 58 H122 M58 98 H142 M36 146 H164" stroke="#e7d3a1" />
          <path d="M92 196 H108 V220 H92 Z" />
        </g>
        <circle cx="100" cy="16" r="4.5" fill="#f7fbff" />
      </svg>
      <p id="fallback-note">当前浏览器无法显示星图，按钮和按键仍可切换。</p>
    </div>
    <div class="wordmark">
      <p class="merry">MERRY CHRISTMAS</p>
    </div>
    <div id="ornaments" class="ornaments"></div>
    <aside class="cam-card" aria-label="摄像头">
      <div class="cam-stage">
        <video id="cam-video" playsinline webkit-playsinline x5-playsinline x5-video-player-type="h5" muted></video>
        <canvas id="cam-canvas"></canvas>
      </div>
      <p id="cam-label" class="cam-label" aria-live="polite">摄像头未开启</p>
      <button id="cam-button" type="button">开启摄像头</button>
    </aside>
    <div class="dock">
      <p class="legend">握拳收紧成树 · 张掌落下细雪 · OK 挂上照片 · 捏合钉一颗星</p>
      <div class="chips" role="group" aria-label="场景切换">
        <button type="button" data-mode="tree" aria-pressed="true">1 握拳 · 成树</button>
        <button type="button" data-mode="snow" aria-pressed="false">2 张掌 · 细雪</button>
        <button type="button" data-mode="photos" aria-pressed="false">3 OK · 照片</button>
      </div>
      <div class="upload-row">
        <button type="button" id="pin-button">钉一颗星</button>
        <button type="button" id="upload-button">上传人像或宠物</button>
        <button type="button" id="reset-photos" hidden>恢复示例</button>
        <input id="photo-input" type="file" accept="image/*" multiple hidden />
      </div>
      <p id="model-status" class="model-status">正在准备手势模型…</p>
      <p id="alert" class="alert" role="alert" hidden></p>
    </div>
    <div id="hud"></div>
    <script type="module" src="/src/scenes/christmas/main.ts"></script>
  </body>
</html>
